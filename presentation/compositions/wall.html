    </div>
    <div id="wall-dropped" class="wall-group" style="left: 1660px; width: 186px">
      <p class="wall-count" data-to="25">0</p>
      <p class="wall-name">Dropped</p>
      <div class="wall-bar"><span style="flex: 1; background: #6b6a72"></span></div>
    </div>
  </div>

  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const tiles = Array.from(document.querySelectorAll("#wall-tiles .wall-tile"));

      // The wall: 24 x 10, as the app's grid reads, edge to edge.
      const home = (tile) => {
        const i = Number(tile.dataset.i);
        return { x: 4 + (i % 24) * 80, y: 24 + Math.floor(i / 24) * 104 };
      };
      // Sorted: one block per group, filled column by column, 10 tiles high, 58 x 77 px.
      const groupX = [74, 624, 854, 1660];
      const sorted = (tile) => {
        const k = Number(tile.dataset.k);
        return { x: groupX[Number(tile.dataset.g)] + Math.floor(k / 10) * 64, y: 212.67 + (k % 10) * 83.33 };
      };

      // The camera starts on Breath of the Wild, 750 x 1000 in the middle of the frame, where the
      // detail view's cover left off, and pulls back on a log-scale zoom.
      const hero = tiles.find((tile) => tile.title === "The Legend of Zelda: Breath of the Wild");
      const start = home(hero);
      const centre = { x: start.x + 36, y: start.y + 48 };
      gsap.set("#wall-hero", { x: start.x, y: start.y });
      const zoom = 750 / 72;
      const camera = { z: 0 };
      const place = () => {
        const scale = Math.pow(zoom, 1 - camera.z);
        const px = 960 + (centre.x - 960) * camera.z;
        const py = 540 + (centre.y - 540) * camera.z;
        gsap.set("#wall-cam", { transformOrigin: "0 0", scale, x: px - centre.x * scale, y: py - centre.y * scale });
      };
      tl.fromTo(camera, { z: 0 }, { z: 1, duration: 1.7, ease: "power3.inOut", onUpdate: place, onStart: place }, 0.15);
      place();
      tl.fromTo("#wall-tiles", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.in" }, 0.35);
      tl.fromTo("#wall-hero", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "none" }, 1.45);

      // The sort, timed like the app's own Flip reflow.
      tl.fromTo(
        tiles,
        { x: (i, tile) => home(tile).x, y: (i, tile) => home(tile).y, scale: 1, transformOrigin: "0 0" },
        {
          x: (i, tile) => sorted(tile).x,
          y: (i, tile) => sorted(tile).y,
          scale: 58 / 72,
          duration: 0.9,
          ease: "expo.inOut",
          stagger: { amount: 0.35 },
        },
        2.35,
      );
      tl.to(
        tiles.filter((tile) => tile.dataset.status === "Dropped"),
        { opacity: 0.45, duration: 0.5, ease: "power2.out" },
        3.45,
      );

      // Each group's count lands with its status bar.
      ["#wall-played", "#wall-playing", "#wall-next", "#wall-dropped"].forEach((id, index) => {
        const at = 3.2 + index * 0.08;
        const count = document.querySelector(id + " .wall-count");
        const value = { n: 0 };
        tl.fromTo(
          value,
          { n: 0 },
          {
            n: Number(count.dataset.to),
            duration: 1.3,
            ease: "power3.out",
            onUpdate: () => {
              count.textContent = String(Math.round(value.n));
            },
          },
          at,
        );
        tl.fromTo(id, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, at);
        tl.fromTo(id + " .wall-bar", { scaleX: 0, transformOrigin: "0 50%" }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, at + 0.05);
      });

      window.__timelines["wall"] = tl;
    })();
  </script>
</template>
