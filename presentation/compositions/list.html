  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      // Rows crawl, then rush: expo.in keeps the first seconds readable. The blur follows the speed.
      tl.fromTo("#list-body", { y: 0 }, { y: -15396, duration: 4.95, ease: "expo.in" }, 0);
      tl.fromTo(
        "#list-vblur-amount",
        { attr: { stdDeviation: "0 0" } },
        { attr: { stdDeviation: "0 28" }, duration: 4.95, ease: "expo.in" },
        0,
      );

      // "237 games in Notion": the number is there on frame 0, the rest arrives word by word.
      tl.fromTo(
        "#list-title-1 .w:not(:first-child)",
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" },
        0.1,
      );
      tl.to("#list-title-1 .w", { opacity: 0, filter: "blur(8px)", duration: 0.15, stagger: 0.04, ease: "power3.in" }, 2.3);

      tl.fromTo(
        "#list-title-2 .w",
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power2.out" },
        2.55,
      );
      tl.to("#list-title-2 .w", { opacity: 0, filter: "blur(8px)", duration: 0.15, stagger: 0.04, ease: "power3.in" }, 4.4);

      // The list folds into its count: the table collapses onto the number's centre line.
      tl.fromTo(
        "#list-table",
        { scaleY: 1, transformOrigin: "50% 222.7px" },
        { scaleY: 0.004, duration: 0.42, ease: "power3.in" },
        4.55,
      );
      tl.to("#list-table", { opacity: 0, duration: 0.06 }, 4.94);
      tl.fromTo(
        "#list-count-paper",
        { scaleY: 0.02, opacity: 0, transformOrigin: "50% 50%" },
        { scaleY: 1, opacity: 1, duration: 0.42, ease: "expo.out" },
        4.9,
      );

      // Night rises like the app's curtain, already at 237.
      tl.fromTo(
        "#list-night",
        { clipPath: "inset(100% 0% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "expo.inOut" },
        5.3,
      );

      window.__timelines["list"] = tl;
