<template>
  <style>

      @font-face { font-family: "Geist"; src: url("assets/fonts/geist-latin.woff2") format("woff2"); font-weight: 100 900; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Geist Mono"; src: url("assets/fonts/geist-mono-latin-ext.woff2") format("woff2"); font-weight: 100 900; font-display: block; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: "Geist Mono"; src: url("assets/fonts/geist-mono-latin.woff2") format("woff2"); font-weight: 100 900; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

    /* Transparent: during the whip the outgoing hero shows above the arriving footage. */
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #search-cam {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }

    .search-footage {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      object-fit: cover;
    }

    /* Darkens everything but the detail view's cover (1440 px viewport x 4/3) before the cut: four
       bands around it and a short rounded shadow for its corners. They fade by colour, not opacity:
       an opacity group this large is clipped when Chrome draws it through an offscreen surface. */
    #search-mask {
      position: absolute;
      left: 237.333px;
      top: 118px;
      width: 480px;
      height: 640px;
      border-radius: 32px;
      box-shadow: 0 0 0 48px rgb(8 8 12 / 0);
    }

    .mask-band {
      position: absolute;
      background: rgb(8 8 12 / 0);
    }

    /* Breath of the Wild's row, as the Notion table stores it. Geist Mono is 0.6 em a character. */
    #search-strip {
      position: absolute;
      left: 96px;
      top: 960px;
      width: 1340px;
      height: 80px;
      border-radius: 14px;
      background: var(--color-paper, #f2f1ee);
    }

    .strip-value {
      position: absolute;
      top: 960px;
      height: 80px;
      padding: 0 14px;
      border-radius: 12px;
      background: var(--color-paper, #f2f1ee);
      color: #08080c;
      font-family: "Geist Mono", monospace;
      font-size: 28px;
      line-height: 80px;
      white-space: nowrap;
    }
  </style>

  <div id="root" data-composition-id="search" data-width="1920" data-height="1080">
    <!-- Motion blur off: its zoom capture drops the colour-faded mask bands outside the camera box. -->
    <div id="search-cam" data-layout-allow-overflow data-motion-blur="off">
      <!-- Footage: search "zelda", open Breath of the Wild. The trip from the results to the card
           (cursor and scroll, footage 3.55 to 5.75 s) plays at 2x, one source frame in two. -->
      <video
        id="search-video"
        class="clip search-footage"
        data-start="0"
        data-duration="3.55"
        data-media-start="0"
        data-track-index="0"
        src="assets/footage/search.mp4"
        muted
        playsinline
      ></video>
      <video
        id="search-video-fast"
        class="clip search-footage"
        data-start="3.55"
        data-duration="1.1"
        data-media-start="3.55"
        data-hf-media-start-basis="local"
        data-playback-rate="2"
        data-track-index="0"
        src="assets/footage/search.mp4"
        muted
        playsinline
      ></video>
      <video
        id="search-video-open"
        class="clip search-footage"
        data-start="4.65"
        data-duration="3.85"
        data-media-start="5.75"
        data-hf-media-start-basis="local"
        data-track-index="0"
        src="assets/footage/search.mp4"
        muted
        playsinline
      ></video>
      <div id="search-mask" data-layout-ignore>
        <div class="mask-band" style="left: -600px; top: -500px; width: 2400px; height: 500px"></div>
        <div class="mask-band" style="left: -600px; top: 640px; width: 2400px; height: 460px"></div>
        <div class="mask-band" style="left: -600px; top: 0; width: 600px; height: 640px"></div>
        <div class="mask-band" style="left: 480px; top: 0; width: 1320px; height: 640px"></div>
      </div>
    </div>

    <div id="search-strip" data-layout-ignore></div>
    <div id="strip-name" class="strip-value" style="left: 110px" data-layout-ignore>The Legend of Zelda: Breath of the Wild</div>
    <div id="strip-platform" class="strip-value" style="left: 813.2px" data-layout-ignore>Nintendo Switch</div>
    <div id="strip-status" class="strip-value" style="left: 1113.2px" data-layout-ignore>Done</div>
    <div id="strip-score" class="strip-value" style="left: 1228.4px" data-layout-ignore>97</div>
    <div id="strip-hours" class="strip-value" style="left: 1310px" data-layout-ignore>50,00</div>
  </div>

  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const K = 4 / 3; // footage CSS pixels (1440 x 810) to frame pixels

      // Camera states: scale about the top-left corner, then translate.
      const field = { scale: 1.45, x: -67.6, y: -110 };
      const facts = { scale: 1.25, x: -240, y: -4 };
      const cover = { scale: 1.5625, x: 960 - (178 + 180) * K * 1.5625, y: 540 - (88.5 + 240) * K * 1.5625 };
      const onScreen = (cam, cssX, cssY) => ({ x: cssX * K * cam.scale + cam.x, y: cssY * K * cam.scale + cam.y });

      // Arrive with the page's scroll: the collection comes up from below.
      tl.fromTo("#search-cam", { x: 0, y: 1080, scale: 1, transformOrigin: "0 0" }, { y: 0, duration: 0.36, ease: "power4.inOut" }, 0);
      // Into the search field as the cursor reaches it, back out for the reflow.
      tl.to("#search-cam", { ...field, duration: 0.5, ease: "power2.inOut" }, 0.55);
      tl.to("#search-cam", { scale: 1, x: 0, y: 0, duration: 0.55, ease: "power2.inOut" }, 2.05);
      // The detail view: frame the whole of it, then the cover alone.
      tl.to("#search-cam", { ...facts, duration: 0.55, ease: "power2.inOut" }, 5.65);
      tl.to("#search-cam", { ...cover, duration: 0.6, ease: "power2.inOut" }, 7.9);
      tl.fromTo(
        ".mask-band",
        { backgroundColor: "rgba(8, 8, 12, 0)" },
        { backgroundColor: "rgba(8, 8, 12, 1)", duration: 0.5, ease: "power2.inOut" },
        7.95,
      );
      tl.fromTo(
        "#search-mask",
        { boxShadow: "0 0 0 48px rgba(8, 8, 12, 0)" },
        { boxShadow: "0 0 0 48px rgba(8, 8, 12, 1)", duration: 0.5, ease: "power2.inOut" },
        7.95,
      );

      // The row rises from the table's world; each value flies to what it becomes in the app.
      tl.fromTo(
        "#search-strip, .strip-value",
        { y: 140 },
        { y: 0, duration: 0.5, ease: "expo.out" },
        5.95,
      );
      const flights = [
        // [element, its centre in the strip, target centre in footage CSS pixels, landing scale]
        ["#strip-score", { x: 1259.2, y: 1000 }, { x: 627, y: 463.8 }, 0.8],
        ["#strip-hours", { x: 1366, y: 1000 }, { x: 857, y: 453.8 }, 0.9],
        ["#strip-status", { x: 1160.8, y: 1000 }, { x: 759.2, y: 104.5 }, 0.7],
        ["#strip-platform", { x: 953.2, y: 1000 }, { x: 635, y: 104.5 }, 0.7],
      ];
      flights.forEach(([selector, from, target, scale], index) => {
        const to = onScreen(facts, target.x, target.y);
        const at = 6.75 + index * 0.12;
        tl.to(selector, { x: to.x - from.x, y: to.y - from.y, scale, duration: 0.55, ease: "power3.inOut" }, at);
        tl.to(selector, { opacity: 0, scale: scale * 0.9, filter: "blur(4px)", duration: 0.2, ease: "power2.in" }, at + 0.65);
      });
      // The name grows into the title it becomes and dissolves on the way.
      const title = onScreen(facts, 924, 232.7);
      tl.to("#strip-name", { x: title.x - 451.6, y: title.y - 1000, scale: 1.6, duration: 0.6, ease: "power3.inOut" }, 7.23);
      tl.to("#strip-name", { opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, 7.5);
      tl.to("#search-strip", { y: 140, duration: 0.3, ease: "power3.in" }, 7.5);

      window.__timelines["search"] = tl;
    })();
  </script>
</template>
