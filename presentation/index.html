<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-night","type":"color","label":"Night (the app ground)","default":"#08080c"},
    {"id":"color-paper","type":"color","label":"Paper (the table ground)","default":"#f2f1ee"},
    {"id":"color-accent","type":"color","label":"Accent","default":"#9085e9"},
    {"id":"cta","type":"string","label":"Call to action","default":"github.com/nicanac/Gamelist"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #08080c;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- One long list: the Notion table, the app (footage), one search, all 237 covers, the claim. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="35.2"
      data-width="1920"
      data-height="1080"
      data-motion-blur="on"
    >
      <div
        id="list"
        data-composition-id="list"
        data-composition-src="compositions/list.html"
        data-start="0"
        data-duration="6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>
      <div
        id="app"
        data-composition-id="app"
        data-composition-src="compositions/app.html"
        data-start="6"
        data-duration="4.75"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>
      <div
        id="search"
        data-composition-id="search"
        data-composition-src="compositions/search.html"
        data-start="10.35"
        data-duration="8.5"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>
      <div
        id="wall"
        data-composition-id="wall"
        data-composition-src="compositions/wall.html"
        data-start="18.85"
        data-duration="6.9"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 4"
      ></div>
      <div
        id="claim"
        data-composition-id="claim"
        data-composition-src="compositions/claim.html"
        data-start="25.2"
        data-duration="5"
        data-track-index="5"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 5"
      ></div>
      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="30"
        data-duration="5.2"
        data-track-index="6"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 6"
      ></div>

      <!-- Effects only (no music source here). Each starts so its measured peak lands a frame after
           its picture: whoosh 0.162 s, whoosh-cinematic 2.503 s, click 0.073 s, key-press 0.076 s,
           pop 0.12 s, riser 3.472 s, impact-bass-1 0.073 s, impact-bass-2 1.986 s. -->
      <!-- Title words arriving: a soft key tick per word (the first word is on screen at frame 0). -->
      <audio id="sfx-title-games" class="clip" data-start="0.057" data-duration="0.13" data-track-index="13" data-volume="0.6" src="assets/sfx/key-press.mp3"></audio>
      <audio id="sfx-title-in" class="clip" data-start="0.124" data-duration="0.13" data-track-index="16" data-volume="0.5" src="assets/sfx/key-press.mp3"></audio>
      <audio id="sfx-title-notion" class="clip" data-start="0.19" data-duration="0.13" data-track-index="13" data-volume="0.6" src="assets/sfx/key-press.mp3"></audio>
      <audio id="sfx-title-one" class="clip" data-start="2.507" data-duration="0.13" data-track-index="16" data-volume="0.6" src="assets/sfx/key-press.mp3"></audio>
      <audio id="sfx-title-very" class="clip" data-start="2.574" data-duration="0.13" data-track-index="13" data-volume="0.5" src="assets/sfx/key-press.mp3"></audio>
      <audio id="sfx-title-long" class="clip" data-start="2.64" data-duration="0.13" data-track-index="16" data-volume="0.6" src="assets/sfx/key-press.mp3"></audio>
      <audio id="sfx-title-list" class="clip" data-start="2.707" data-duration="0.13" data-track-index="13" data-volume="0.55" src="assets/sfx/key-press.mp3"></audio>
      <audio id="sfx-fold" class="clip" data-start="4.8" data-duration="0.575" data-track-index="10" data-volume="0.35" src="assets/sfx/whoosh.mp3"></audio>
      <audio id="sfx-curtain" class="clip" data-start="4.85" data-duration="5.544" data-track-index="11" data-volume="0.4" src="assets/sfx/whoosh-cinematic.mp3"></audio>
      <audio id="sfx-whip" class="clip" data-start="10.4" data-duration="0.575" data-track-index="10" data-volume="0.35" src="assets/sfx/whoosh.mp3"></audio>
      <audio id="sfx-click-search" class="clip" data-start="11.31" data-duration="0.366" data-track-index="12" data-volume="0.6" src="assets/sfx/click.mp3"></audio>
      <audio id="sfx-key-z" class="clip" data-start="11.607" data-duration="0.13" data-track-index="13" data-volume="0.9" src="assets/sfx/key-press.mp3"></audio>
      <audio id="sfx-key-e" class="clip" data-start="11.74" data-duration="0.13" data-track-index="13" data-volume="0.8" src="assets/sfx/key-press.mp3"></audio>
      <audio id="sfx-key-l" class="clip" data-start="11.874" data-duration="0.13" data-track-index="13" data-volume="0.9" src="assets/sfx/key-press.mp3"></audio>
      <audio id="sfx-key-d" class="clip" data-start="12.007" data-duration="0.13" data-track-index="13" data-volume="0.75" src="assets/sfx/key-press.mp3"></audio>
      <audio id="sfx-key-a" class="clip" data-start="12.14" data-duration="0.13" data-track-index="13" data-volume="0.9" src="assets/sfx/key-press.mp3"></audio>
      <audio id="sfx-click-card" class="clip" data-start="15.31" data-duration="0.366" data-track-index="12" data-volume="0.6" src="assets/sfx/click.mp3"></audio>
      <audio id="sfx-pop" class="clip" data-start="17.563" data-duration="0.72" data-track-index="12" data-volume="0.5" src="assets/sfx/pop.mp3"></audio>
      <audio id="sfx-pullback" class="clip" data-start="17.38" data-duration="5.544" data-track-index="11" data-volume="0.35" src="assets/sfx/whoosh-cinematic.mp3"></audio>
      <audio id="sfx-riser" class="clip" data-start="18.81" data-duration="4.3" data-fade-out="0.4" data-track-index="14" data-volume="0.25" src="assets/sfx/riser.mp3"></audio>
      <audio id="sfx-sort" class="clip" data-start="22.21" data-duration="2.116" data-track-index="15" data-volume="0.35" src="assets/sfx/impact-bass-1.mp3"></audio>
      <audio id="sfx-paper" class="clip" data-start="25.31" data-playback-rate="0.8" data-duration="0.719" data-track-index="10" data-volume="0.25" src="assets/sfx/whoosh.mp3"></audio>
      <audio id="sfx-night" class="clip" data-start="27.51" data-playback-rate="0.8" data-duration="0.719" data-track-index="10" data-volume="0.25" src="assets/sfx/whoosh.mp3"></audio>
      <audio id="sfx-mark" class="clip" data-start="28.65" data-duration="2.592" data-track-index="15" data-volume="0.3" src="assets/sfx/impact-bass-2.mp3"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
